# dsh-t3-support provider registry.
# Each entry becomes one route under the llm-pi-ai providers config.
# Add future models by adding an entry here; no script changes needed.

glm-cn:
  route: zai-coding-cn
  apiKeyEnv: ZAI_CODING_CN_API_KEY
  displayName: GLM Coding Plan

zai-intl:
  route: zai
  apiKeyEnv: ZAI_API_KEY
  displayName: Z.AI

openai:
  route: openai
  apiKeyEnv: OPENAI_API_KEY
  displayName: OpenAI

anthropic:
  route: anthropic
  apiKeyEnv: ANTHROPIC_API_KEY
  displayName: Anthropic

gemini:
  route: google
  apiKeyEnv: GEMINI_API_KEY
  displayName: Google Gemini

openrouter:
  route: openrouter
  apiKeyEnv: OPENROUTER_API_KEY
  displayName: OpenRouter

groq:
  route: groq
  apiKeyEnv: GROQ_API_KEY
  displayName: Groq

together:
  route: together
  apiKeyEnv: TOGETHER_API_KEY
  displayName: Together AI

qwen:
  route: qwen-token-plan
  apiKeyEnv: QWEN_TOKEN_PLAN_API_KEY
  displayName: Qwen Token Plan

moonshot:
  route: moonshotai
  apiKeyEnv: MOONSHOT_API_KEY
  displayName: Moonshot AI

xai:
  route: xai
  apiKeyEnv: XAI_API_KEY
  displayName: xAI
